name: GARVIS Town Square

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  observe:
    name: Observe Agent Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Brain gate — predict
        run: |
          python3 ci-fix-bot/brain_gate.py predict             --agent town-square             --label "town-square-${{ github.run_id }}"             --predicted 1.0             --confidence 0.9

      - name: Observe agent messages
        run: python3 ci-fix-bot/agent_bus.py list --repo .

      - name: Observe agent health
        run: |
          python3 - <<'PYINNER'
          import json
          from pathlib import Path
          path = Path("ci-fix-bot/agent_bus.json")
          if not path.exists():
              print("Agent bus not initialized.")
              raise SystemExit(0)
          bus = json.loads(path.read_text())
          status = bus.get("agent_status", {})
          print(json.dumps(status, indent=2, sort_keys=True))
          PYINNER

      - name: Brain gate — observe & falsify
        if: always()
        run: |
          python3 ci-fix-bot/brain_gate.py observe             --agent town-square             --label "town-square-${{ github.run_id }}"             --observed "${{ (job.status == 'success' && 1.0) || 0.0 }}" || true
          python3 ci-fix-bot/brain_gate.py falsify --agent town-square || true
