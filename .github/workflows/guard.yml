name: Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard:
    name: Repository guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the guard needs a merge base with the target branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Brain gate — predict
        run: |
          python3 ci-fix-bot/brain_gate.py predict \
            --agent guard \
            --label "guard-${{ github.run_id }}" \
            --predicted 1.0 \
            --confidence 0.9
      - name: Run repository guard
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python .github/scripts/guard_check.py
      - name: Brain gate — observe & falsify
        if: always()
        run: |
          python3 ci-fix-bot/brain_gate.py observe \
            --agent guard \
            --label "guard-${{ github.run_id }}" \
            --observed 1.0 || true
          python3 ci-fix-bot/brain_gate.py falsify --agent guard || true
