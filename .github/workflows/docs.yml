# Divine Foundation: Ten Commandments Workflow
# "You shall not bear false witness" - Ensure truthful documentation deployment
# Aligned with biblical principles and natural law compliance

name: Deploy docs

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

permissions:
  contents: write # This allows pushing to gh-pages

jobs:
  deploy_docs:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Brain gate — predict
        run: |
          python3 ci-fix-bot/brain_gate.py predict \
            --agent docs \
            --label "docs-${{ github.run_id }}" \
            --predicted 1.0 \
            --confidence 0.9
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: make sync
      - name: Deploy docs
        run: make deploy-docs
      - name: Brain gate — observe & falsify
        if: always()
        run: |
          python3 ci-fix-bot/brain_gate.py observe \
            --agent docs \
            --label "docs-${{ github.run_id }}" \
            --observed "${{ (job.status == 'success' && 1.0) || 0.0 }}" || true
          python3 ci-fix-bot/brain_gate.py falsify --agent docs || true
