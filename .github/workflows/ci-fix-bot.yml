name: GARVIS CI Fix Bot

# This bot triggers when any CI workflow fails.
# It:
# 1. Fingerprints the failure and records it in the Pattern Registry
# 2. Runs the fix engine against known patterns
# 3. For fixable patterns: prepares a repair proposal and preserves evidence
# 4. For unknown patterns: preserves diagnosis and broadcasts locally to agents
#
# Agent communication: uses the Agent Bus to notify other agents of findings.
# Pattern lifecycle: DETECTED → DIAGNOSED → REVIEWED → TESTED → PROMOTED

on:
  workflow_run:
    workflows:
      - "Tests"
      - "Guard"
      - "Deploy docs"
      - "Publish to PyPI"
      - "Issue Management"
    types:
      - completed

jobs:
  diagnose-and-fix:
    name: Diagnose & Auto-Fix CI Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Brain gate — predict
        run: |
          python3 ci-fix-bot/brain_gate.py predict \
            --agent ci-fix-bot \
            --label "diagnose-${{ github.event.workflow_run.id }}" \
            --predicted 1.0 \
            --confidence 0.8
      - name: Capture failure metadata
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.exportVariable('FAILED_WORKFLOW', run.name);
            core.exportVariable('FAILED_RUN_ID', String(run.id));
            core.exportVariable('FAILED_HEAD_SHA', run.head_sha);
            core.exportVariable('FAILED_EVENT', run.event);
            core.exportVariable('FAILED_HTML_URL', run.html_url);
            core.exportVariable('FAILED_BRANCH', run.head_branch);
            core.info(`Failure in ${run.name} on ${run.head_branch} (${run.head_sha.slice(0,12)})`);

      - name: Download failure logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          rm -rf failure-logs failure-logs.zip
          mkdir -p failure-logs

          curl --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/logs" \
            -o failure-logs.zip

          unzip -q failure-logs.zip -d failure-logs
          test -n "$(find failure-logs -type f -print -quit)"

          # Concatenate all log files for the fix engine
          find failure-logs -type f -exec cat {} + > /tmp/all-logs.txt
          echo "Log lines: $(wc -l < /tmp/all-logs.txt)"

      - name: Record failure in Pattern Registry
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            try {
              const result = execSync(
                `python3 ci-fix-bot/pattern_registry.py record /tmp/all-logs.txt . --recognized`,
                { encoding: 'utf-8' }
              );
              const record = JSON.parse(result.trim().split('\n').pop());
              core.exportVariable('PATTERN_FINGERPRINT', record.fingerprint);
              core.exportVariable('PATTERN_IS_NEW', record.is_new ? 'true' : 'false');
              core.exportVariable('PATTERN_STATUS', record.status);
              core.exportVariable('PATTERN_SIGNATURE', record.signature);
              core.exportVariable('PATTERN_COUNT', record.detected_count.toString());
              core.info(`Pattern ${record.fingerprint} — ${record.status} (seen ${record.detected_count}x)`);
            } catch (e) {
              core.warning(`Could not record pattern: ${e.message}`);
              core.exportVariable('PATTERN_IS_NEW', 'false');
              core.exportVariable('PATTERN_FINGERPRINT', 'unknown');
              core.exportVariable('PATTERN_SIGNATURE', 'Unable to download failure logs');
              core.exportVariable('PATTERN_COUNT', '1');
            }

      - name: Run fix engine
        id: fix
        run: |
          if [ -f "ci-fix-bot/fix_engine.py" ]; then
            python3 ci-fix-bot/fix_engine.py /tmp/all-logs.txt . 2>&1 | tee /tmp/fix-result.json
            if [ $? -eq 0 ]; then
              echo "fixed=true" >> $GITHUB_OUTPUT
            else
              echo "fixed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo '{"any_fixed": false, "results": []}' > /tmp/fix-result.json
            echo "fixed=false" >> $GITHUB_OUTPUT
          fi

      - name: Record fix result in registry
        if: steps.fix.outputs.fixed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/fix-result.json', 'utf8'));
            const fixedPattern = result.results.find(r => r.fixed);
            if (fixedPattern) {
              try {
                execSync(
                  `python3 ci-fix-bot/pattern_registry.py record /tmp/all-logs.txt . --recognized --fix-result '${JSON.stringify(fixedPattern)}'`,
                  { encoding: 'utf-8' }
                );
                core.info(`Updated pattern registry with fix result for ${fixedPattern.pattern}`);
              } catch (e) {
                core.warning(`Could not update registry: ${e.message}`);
              }
            }

      - name: Post agent bus messages
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const fingerprint = process.env.PATTERN_FINGERPRINT || '';
            const signature = process.env.PATTERN_SIGNATURE || 'unknown';
            const patternCount = process.env.PATTERN_COUNT || '1';
            const workflow = process.env.FAILED_WORKFLOW;
            const sha = process.env.FAILED_HEAD_SHA;
            const fixed = '${{ steps.fix.outputs.fixed }}' === 'true';

            let patternName = 'unknown';
            if (fs.existsSync('/tmp/fix-result.json')) {
              try {
                const result = JSON.parse(fs.readFileSync('/tmp/fix-result.json', 'utf8'));
                const fixedR = result.results.find(r => r.fixed);
                if (fixedR) patternName = fixedR.pattern;
              } catch (e) {}
            }

            // Post status to agent bus
            try {
              const status = fixed ? `FIXED (${patternName})` : `UNFIXABLE`;
              execSync(
                `python3 ci-fix-bot/agent_bus.py status ci-fix-bot "${status}" --repo . --finding "${signature}"`,
                { encoding: 'utf-8' }
              );
              core.info(`Posted ci-fix-bot status: ${status}`);
            } catch (e) {
              core.warning(`Could not post agent status: ${e.message}`);
            }

            // Post messages to relevant agents
            if (fixed) {
              if (patternName.includes('type_ignore') || patternName.includes('mypy') || patternName.includes('lint')) {
                try {
                  execSync(
                    `python3 ci-fix-bot/agent_bus.py post ci-fix-bot code-quality-agent FINDING "Auto-fixed ${patternName}" "CI Fix Bot auto-fixed a ${patternName} issue in ${workflow}. Pattern: ${fingerprint}." --repo .`,
                    { encoding: 'utf-8' }
                  );
                  core.info('Notified code-quality-agent of fix');
                } catch (e) {
                  core.warning(`Could not notify code-quality-agent: ${e.message}`);
                }
              }
            } else {
              try {
                execSync(
                  `python3 ci-fix-bot/agent_bus.py post ci-fix-bot all ALERT "Unfixable CI failure: ${signature}" "${workflow} failed on ${sha.slice(0,12)}. Pattern: ${fingerprint} (seen ${patternCount}x)." --repo .`,
                  { encoding: 'utf-8' }
                );
                core.info('Broadcast alert to all agents');
              } catch (e) {
                core.warning(`Could not broadcast alert: ${e.message}`);
              }
            }

      - name: Preserve proposed repair evidence
        if: steps.fix.outputs.fixed == 'true'
        run: |
          echo "## GARVIS CI proposed repair" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed workflow: $FAILED_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed SHA: $FAILED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --check

      - name: Preserve unfixable diagnosis
        if: steps.fix.outputs.fixed != 'true'
        run: |
          echo "## GARVIS CI diagnosis requires review" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $FAILED_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed SHA: $FAILED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Pattern: $PATTERN_FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
          echo "No repository mutation was performed." >> "$GITHUB_STEP_SUMMARY"

      - name: Brain gate — observe & falsify
        if: always()
        run: |
          if [ "${{ steps.fix.outputs.fixed }}" = "true" ]; then
          OBSERVED=1.0
          else
          OBSERVED=0.0
          fi
          python3 ci-fix-bot/brain_gate.py observe \
            --agent ci-fix-bot \
            --label "diagnose-${{ github.event.workflow_run.id }}" \
            --observed $OBSERVED || true
          python3 ci-fix-bot/brain_gate.py falsify --agent ci-fix-bot || true
