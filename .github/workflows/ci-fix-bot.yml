name: GARVIS CI Fix Bot

# This bot triggers when any CI workflow fails.
# It:
# 1. Fingerprints the failure and records it in the Pattern Registry
# 2. Runs the fix engine against known patterns
# 3. For fixable patterns: pushes a fix PR and notifies relevant agents
# 4. For unknown patterns: creates an issue + broadcasts to agents for help
#
# Agent communication: uses the Agent Bus to notify other agents of findings.
# Pattern lifecycle: DETECTED → DIAGNOSED → REVIEWED → TESTED → PROMOTED

on:
  workflow_run:
    workflows:
      - "Tests"
      - "Guard"
      - "Deploy docs"
      - "Publish to PyPI"
      - "Issue Management"
    types:
      - completed

jobs:
  diagnose-and-fix:
    name: Diagnose & Auto-Fix CI Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture failure metadata
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.exportVariable('FAILED_WORKFLOW', run.name);
            core.exportVariable('FAILED_RUN_ID', run.id);
            core.exportVariable('FAILED_HEAD_SHA', run.head_sha);
            core.exportVariable('FAILED_EVENT', run.event);
            core.exportVariable('FAILED_HTML_URL', run.html_url);
            core.exportVariable('FAILED_BRANCH', run.head_branch);
            core.info(`Failure in ${run.name} on ${run.head_branch} (${run.head_sha.slice(0,12)})`);

      - name: Download failure logs
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const fs = require('fs');
            const https = require('https');

            const result = await github.rest.actions.downloadWorkflowRunLogs({
              ...context.repo,
              run_id: runId
            });

            await new Promise((resolve, reject) => {
              const file = fs.createWriteStream('/tmp/failure-logs.zip');
              const get = (url) => {
                https.get(url, (res) => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    get(res.headers.location);
                    return;
                  }
                  res.pipe(file);
                  file.on('finish', () => { file.close(); resolve(); });
                }).on('error', reject);
              };
              get(result.data.url);
            });

            core.info('Downloaded failure logs');

      - name: Extract logs
        run: |
          mkdir -p /tmp/failure-logs
          python3 -c "
          import zipfile
          with zipfile.ZipFile('/tmp/failure-logs.zip', 'r') as z:
              z.extractall('/tmp/failure-logs/')
          "
          find /tmp/failure-logs -name '*.txt' -exec cat {} \; > /tmp/all-logs.txt 2>/dev/null
          echo "Log lines: $(wc -l < /tmp/all-logs.txt)"

      - name: Record failure in Pattern Registry
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            try {
              const result = execSync(
                `python3 ci-fix-bot/pattern_registry.py record /tmp/all-logs.txt . --recognized`,
                { encoding: 'utf-8' }
              );
              const record = JSON.parse(result.trim().split('\n').pop());
              core.exportVariable('PATTERN_FINGERPRINT', record.fingerprint);
              core.exportVariable('PATTERN_IS_NEW', record.is_new ? 'true' : 'false');
              core.exportVariable('PATTERN_STATUS', record.status);
              core.exportVariable('PATTERN_SIGNATURE', record.signature);
              core.exportVariable('PATTERN_COUNT', record.detected_count.toString());
              core.info(`Pattern ${record.fingerprint} — ${record.status} (seen ${record.detected_count}x)`);
            } catch (e) {
              core.warning(`Could not record pattern: ${e.message}`);
              core.exportVariable('PATTERN_IS_NEW', 'false');
            }

      - name: Run fix engine
        id: fix
        run: |
          if [ -f "ci-fix-bot/fix_engine.py" ]; then
            python3 ci-fix-bot/fix_engine.py /tmp/all-logs.txt . 2>&1 | tee /tmp/fix-result.json
            if [ $? -eq 0 ]; then
              echo "fixed=true" >> $GITHUB_OUTPUT
            else
              echo "fixed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo '{"any_fixed": false, "results": []}' > /tmp/fix-result.json
            echo "fixed=false" >> $GITHUB_OUTPUT
          fi

      - name: Record fix result in registry
        if: steps.fix.outputs.fixed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/fix-result.json', 'utf8'));
            const fixedPattern = result.results.find(r => r.fixed);
            if (fixedPattern) {
              try {
                execSync(
                  `python3 ci-fix-bot/pattern_registry.py record /tmp/all-logs.txt . --recognized --fix-result '${JSON.stringify(fixedPattern)}'`,
                  { encoding: 'utf-8' }
                );
                core.info(`Updated pattern registry with fix result for ${fixedPattern.pattern}`);
              } catch (e) {
                core.warning(`Could not update registry: ${e.message}`);
              }
            }

      - name: Post agent bus messages
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const fingerprint = process.env.PATTERN_FINGERPRINT || '';
            const signature = process.env.PATTERN_SIGNATURE || 'unknown';
            const patternCount = process.env.PATTERN_COUNT || '1';
            const workflow = process.env.FAILED_WORKFLOW;
            const sha = process.env.FAILED_HEAD_SHA;
            const fixed = '${{ steps.fix.outputs.fixed }}' === 'true';

            // Read the fix result to get the pattern name
            let patternName = 'unknown';
            let fixDescription = '';
            if (fs.existsSync('/tmp/fix-result.json')) {
              try {
                const result = JSON.parse(fs.readFileSync('/tmp/fix-result.json', 'utf8'));
                const fixedR = result.results.find(r => r.fixed);
                if (fixedR) {
                  patternName = fixedR.pattern;
                  fixDescription = fixedR.description;
                }
              } catch (e) {}
            }

            // Post status to agent bus
            try {
              const status = fixed ? `FIXED (${patternName})` : `UNFIXABLE`;
              const findings = [`${workflow} failed: ${signature}`];
              if (fixed) findings.push(`Auto-fixed with pattern: ${patternName}`);

              execSync(
                `python3 ci-fix-bot/agent_bus.py status ci-fix-bot "${status}" --repo . --finding "${signature}"`,
                { encoding: 'utf-8' }
              );
              core.info(`Posted ci-fix-bot status: ${status}`);
            } catch (e) {
              core.warning(`Could not post agent status: ${e.message}`);
            }

            // Post a message to relevant agents
            if (fixed) {
              // Notify code-quality-agent that we fixed a lint/type issue
              if (patternName.includes('type_ignore') || patternName.includes('mypy') || patternName.includes('lint')) {
                try {
                  execSync(
                    `python3 ci-fix-bot/agent_bus.py post ci-fix-bot code-quality-agent FINDING "Auto-fixed ${patternName}" "CI Fix Bot auto-fixed a ${patternName} issue in ${workflow}. Pattern: ${fingerprint}. This may indicate a systemic code quality issue — please review whether the root cause needs addressing." --repo .`,
                    { encoding: 'utf-8' }
                  );
                  core.info('Notified code-quality-agent of fix');
                } catch (e) {
                  core.warning(`Could not notify code-quality-agent: ${e.message}`);
                }
              }
            } else {
              // Broadcast to all agents — we need help diagnosing this
              try {
                execSync(
                  `python3 ci-fix-bot/agent_bus.py post ci-fix-bot all ALERT "Unfixable CI failure: ${signature}" "${workflow} failed on ${sha.slice(0,12)} and the CI Fix Bot could not auto-fix it. Pattern: ${fingerprint} (seen ${patternCount}x). Any agent with relevant knowledge, please respond." --repo .`,
                  { encoding: 'utf-8' }
                );
                core.info('Broadcast alert to all agents');
              } catch (e) {
                core.warning(`Could not broadcast alert: ${e.message}`);
              }
            }

      - name: Create fix PR
        if: steps.fix.outputs.fixed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const result = JSON.parse(fs.readFileSync('/tmp/fix-result.json', 'utf8'));

            if (!result.any_fixed) return;

            const changedFiles = new Set();
            const fixDescriptions = [];
            for (const r of result.results) {
              if (r.fixed) {
                fixDescriptions.push(`### ${r.pattern}\n\n${r.description}`);
                (r.files_changed || []).forEach(f => changedFiles.add(f));
              }
            }

            if (changedFiles.size === 0) return;

            const workflow = process.env.FAILED_WORKFLOW;
            const sha = process.env.FAILED_HEAD_SHA;
            const branch = `ci-fix-bot/${sha.slice(0, 12)}`;
            const fingerprint = process.env.PATTERN_FINGERPRINT || 'unknown';
            const patternCount = process.env.PATTERN_COUNT || '1';

            try {
              execSync(`git config user.name "GARVIS CI Fix Bot"`);
              execSync(`git config user.email "ci-fix-bot@procityhub.github.io"`);
              execSync(`git checkout -b ${branch}`);
              execSync(`git add ${Array.from(changedFiles).join(' ')}`);
              execSync(`git commit -m "fix(ci): auto-fix ${workflow} failure

            Pattern: ${fingerprint} (seen ${patternCount}x)
            Failed workflow: ${workflow}
            Failed commit: ${sha}

            Fixes applied:
            ${fixDescriptions.join('\\n\\n')}

            Notified via Agent Bus: code-quality-agent
            ---
            Auto-applied by GARVIS CI Fix Bot."`);

              execSync(`git push origin ${branch}`);

              const pr = await github.rest.pulls.create({
                ...context.repo,
                title: `[CI Fix Bot] Auto-fix for ${workflow} (${sha.slice(0, 12)})`,
                head: branch,
                base: process.env.FAILED_BRANCH || 'main',
                body: [
                  `## Auto-Fix PR`,
                  ``,
                  `**Failed workflow:** ${workflow}`,
                  `**Failed run:** ${process.env.FAILED_HTML_URL}`,
                  `**Original commit:** \`${sha}\``,
                  `**Pattern fingerprint:** \`${fingerprint}\``,
                  `**Pattern seen:** ${patternCount}x`,
                  ``,
                  `### Fixes Applied`,
                  ``,
                  fixDescriptions.join('\n\n'),
                  ``,
                  `### Changed Files`,
                  ``,
                  Array.from(changedFiles).map(f => `- \`${f}\``).join('\n'),
                  ``,
                  `### Agent Communication`,
                  ``,
                  `The following agents were notified via the Agent Bus:`,
                  `- **code-quality-agent** — notified of ${fingerprint} pattern`,
                  ``,
                  `---`,
                  `_Auto-applied by **GARVIS CI Fix Bot**._`,
                  `_Pattern lifecycle: DETECTED → DIAGNOSED → REVIEWED → TESTED → PROMOTED_`,
                ].join('\n'),
                labels: ['ci-fix-bot', 'auto-fix'],
              });

              core.info(`Created fix PR #${pr.data.number}`);
            } catch (e) {
              core.error(`Failed to create fix PR: ${e.message}`);
            }

      - name: Create issue for unfixable failures
        if: steps.fix.outputs.fixed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const workflow = process.env.FAILED_WORKFLOW;
            const sha = process.env.FAILED_HEAD_SHA;
            const htmlUrl = process.env.FAILED_HTML_URL;
            const branch = process.env.FAILED_BRANCH;
            const fingerprint = process.env.PATTERN_FINGERPRINT || 'unknown';
            const isNew = process.env.PATTERN_IS_NEW === 'true';
            const patternCount = process.env.PATTERN_COUNT || '1';
            const signature = process.env.PATTERN_SIGNATURE || 'unknown error';

            let errorLines = [];
            try {
              const logs = fs.readFileSync('/tmp/all-logs.txt', 'utf8');
              errorLines = logs.split('\n').filter(l =>
                l.includes('error:') || l.includes('Error:') ||
                l.includes('FAILED') || l.includes('Traceback') ||
                l.includes('Exception') || l.includes('##[error]')
              ).slice(0, 25);
            } catch (e) {}

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'ci-fix-bot'
            });

            const dup = existing.data.find(i =>
              i.body && i.body.includes(fingerprint)
            );

            if (dup) {
              const newBody = dup.body + `\n\n## New occurrence — ${new Date().toISOString()}\n\n- Workflow: ${workflow}\n- Run: ${htmlUrl}\n- Count: ${patternCount}x\n`;
              await github.rest.issues.update({
                ...context.repo,
                issue_number: dup.number,
                body: newBody,
              });

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: dup.number,
                body: `Recurring failure #${patternCount}: [${workflow}](${htmlUrl}) on \`${sha.slice(0, 12)}\`\n\nPattern: \`${fingerprint}\`\nSignature: ${signature}\n\n**Agent Bus:** Alert broadcast to all agents.`,
              });

              core.info(`Updated existing issue #${dup.number}`);
              return;
            }

            const statusBadge = isNew ? '🆕 NEW PATTERN' : `RECURRING (${patternCount}x)`;

            const body = [
              `## CI Failure — ${statusBadge}`,
              ``,
              `**Pattern fingerprint:** \`${fingerprint}\``,
              `**Error signature:** ${signature}`,
              ``,
              `**Workflow:** ${workflow}`,
              `**Branch:** ${branch}`,
              `**Run:** ${htmlUrl}`,
              `**Commit:** \`${sha}\``,
              ``,
              `### Error Excerpt`,
              ``,
              '```',
              errorLines.join('\n') || 'No error lines found',
              '```',
              ``,
              `### Pattern Lifecycle`,
              ``,
              `Status: **DETECTED**`,
              ``,
              `1. **DIAGNOSED** — Identify root cause and write a fix (comment below)`,
              `2. **REVIEWED** — Human reviews and approves the fix`,
              `3. **TESTED** — Add a regression test`,
              `4. **PROMOTED** — Fix added to \`fix_engine.py\``,
              ``,
              `### Agent Communication`,
              ``,
              `**Agent Bus Alert** broadcast to all agents.`,
              `If your agent has knowledge of this failure pattern, respond`,
              `via the Agent Bus with a FINDING or RESPONSE message.`,
              ``,
              `---`,
              `_Auto-created by **GARVIS CI Fix Bot**._`,
              `_It does not think. It pattern-matches._`,
            ].join('\n');

            await github.rest.issues.create({
              ...context.repo,
              title: `[CI Fix Bot] ${statusBadge}: ${signature.slice(0, 80)}`,
              body: body,
              labels: ['ci-failure', 'ci-fix-bot', 'needs-diagnosis', 'agent-bus']
            });

            core.info('Created issue for unfixable failure');
