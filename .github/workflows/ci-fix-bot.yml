name: GARVIS CI Fix Bot

# This bot triggers when any CI workflow fails.
# It:
# 1. Fingerprints the failure and records it in the Pattern Registry
# 2. Runs the fix engine against known patterns
# 3. For fixable patterns: pushes a fix PR
# 4. For unknown patterns: creates an issue to begin the DIAGNOSED lifecycle
#
# Pattern lifecycle: DETECTED → DIAGNOSED → REVIEWED → TESTED → PROMOTED
# New patterns become automatic only after human review + regression test.

on:
  workflow_run:
    workflows:
      - "Tests"
      - "Guard"
      - "Deploy docs"
      - "Publish to PyPI"
      - "Issue Management"
    types:
      - completed

jobs:
  diagnose-and-fix:
    name: Diagnose & Auto-Fix CI Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture failure metadata
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.exportVariable('FAILED_WORKFLOW', run.name);
            core.exportVariable('FAILED_RUN_ID', run.id);
            core.exportVariable('FAILED_HEAD_SHA', run.head_sha);
            core.exportVariable('FAILED_EVENT', run.event);
            core.exportVariable('FAILED_HTML_URL', run.html_url);
            core.exportVariable('FAILED_BRANCH', run.head_branch);
            core.info(`Failure in ${run.name} on ${run.head_branch} (${run.head_sha.slice(0,12)})`);

      - name: Download failure logs
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const fs = require('fs');
            const https = require('https');

            const result = await github.rest.actions.downloadWorkflowRunLogs({
              ...context.repo,
              run_id: runId
            });

            await new Promise((resolve, reject) => {
              const file = fs.createWriteStream('/tmp/failure-logs.zip');
              const get = (url) => {
                https.get(url, (res) => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    get(res.headers.location);
                    return;
                  }
                  res.pipe(file);
                  file.on('finish', () => { file.close(); resolve(); });
                }).on('error', reject);
              };
              get(result.data.url);
            });

            core.info('Downloaded failure logs');

      - name: Extract logs
        run: |
          mkdir -p /tmp/failure-logs
          python3 -c "
          import zipfile
          with zipfile.ZipFile('/tmp/failure-logs.zip', 'r') as z:
              z.extractall('/tmp/failure-logs/')
          "
          find /tmp/failure-logs -name '*.txt' -exec cat {} \; > /tmp/all-logs.txt 2>/dev/null
          echo "Log lines: $(wc -l < /tmp/all-logs.txt)"

      - name: Record failure in Pattern Registry
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            // Record the failure — always, whether or not we can fix it
            try {
              const result = execSync(
                `python3 ci-fix-bot/pattern_registry.py record /tmp/all-logs.txt . --recognized`,
                { encoding: 'utf-8' }
              );
              const record = JSON.parse(result.trim().split('\n').pop());
              core.exportVariable('PATTERN_FINGERPRINT', record.fingerprint);
              core.exportVariable('PATTERN_IS_NEW', record.is_new ? 'true' : 'false');
              core.exportVariable('PATTERN_STATUS', record.status);
              core.exportVariable('PATTERN_SIGNATURE', record.signature);
              core.exportVariable('PATTERN_COUNT', record.detected_count.toString());
              core.info(`Pattern ${record.fingerprint} — ${record.status} (seen ${record.detected_count}x)`);
            } catch (e) {
              core.warning(`Could not record pattern: ${e.message}`);
              core.exportVariable('PATTERN_IS_NEW', 'false');
            }

      - name: Run fix engine
        id: fix
        run: |
          if [ -f "ci-fix-bot/fix_engine.py" ]; then
            python3 ci-fix-bot/fix_engine.py /tmp/all-logs.txt . 2>&1 | tee /tmp/fix-result.json
            if [ $? -eq 0 ]; then
              echo "fixed=true" >> $GITHUB_OUTPUT
            else
              echo "fixed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo '{"any_fixed": false, "results": []}' > /tmp/fix-result.json
            echo "fixed=false" >> $GITHUB_OUTPUT
          fi

      - name: Record fix result in registry
        if: steps.fix.outputs.fixed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/fix-result.json', 'utf8'));
            const fixedPattern = result.results.find(r => r.fixed);
            if (fixedPattern) {
              try {
                execSync(
                  `python3 ci-fix-bot/pattern_registry.py record /tmp/all-logs.txt . --recognized --fix-result '${JSON.stringify(fixedPattern)}'`,
                  { encoding: 'utf-8' }
                );
                core.info(`Updated pattern registry with fix result for ${fixedPattern.pattern}`);
              } catch (e) {
                core.warning(`Could not update registry: ${e.message}`);
              }
            }

      - name: Create fix PR
        if: steps.fix.outputs.fixed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const result = JSON.parse(fs.readFileSync('/tmp/fix-result.json', 'utf8'));

            if (!result.any_fixed) {
              core.info('No auto-fixes could be applied');
              return;
            }

            const changedFiles = new Set();
            const fixDescriptions = [];
            for (const r of result.results) {
              if (r.fixed) {
                fixDescriptions.push(`### ${r.pattern}\n\n${r.description}`);
                (r.files_changed || []).forEach(f => changedFiles.add(f));
              }
            }

            if (changedFiles.size === 0) {
              core.info('Fix engine reported success but no files changed');
              return;
            }

            const workflow = process.env.FAILED_WORKFLOW;
            const sha = process.env.FAILED_HEAD_SHA;
            const branch = `ci-fix-bot/${sha.slice(0, 12)}`;
            const fingerprint = process.env.PATTERN_FINGERPRINT || 'unknown';
            const patternCount = process.env.PATTERN_COUNT || '1';

            try {
              execSync(`git config user.name "GARVIS CI Fix Bot"`);
              execSync(`git config user.email "ci-fix-bot@procityhub.github.io"`);
              execSync(`git checkout -b ${branch}`);
              execSync(`git add ${Array.from(changedFiles).join(' ')}`);
              execSync(`git commit -m "fix(ci): auto-fix ${workflow} failure

            Auto-applied by GARVIS CI Fix Bot.
            Pattern: ${fingerprint} (seen ${patternCount}x)

            Failed workflow: ${workflow}
            Failed commit: ${sha}
            Run: ${process.env.FAILED_HTML_URL}

            Fixes applied:
            ${fixDescriptions.join('\\n\\n')}

            ---
            This PR was created automatically by the GARVIS CI Fix Bot.
            It does not think. It pattern-matches errors against known fix patterns."`);

              execSync(`git push origin ${branch}`);

              const pr = await github.rest.pulls.create({
                ...context.repo,
                title: `[CI Fix Bot] Auto-fix for ${workflow} (${sha.slice(0, 12)})`,
                head: branch,
                base: process.env.FAILED_BRANCH || 'main',
                body: [
                  `## Auto-Fix PR`,
                  ``,
                  `**Failed workflow:** ${workflow}`,
                  `**Failed run:** ${process.env.FAILED_HTML_URL}`,
                  `**Original commit:** \`${sha}\``,
                  `**Pattern fingerprint:** \`${fingerprint}\``,
                  `**Pattern seen:** ${patternCount}x`,
                  ``,
                  `### Fixes Applied`,
                  ``,
                  fixDescriptions.join('\n\n'),
                  ``,
                  `### Changed Files`,
                  ``,
                  Array.from(changedFiles).map(f => `- \`${f}\``).join('\n'),
                  ``,
                  `---`,
                  `_This PR was created automatically by the **GARVIS CI Fix Bot**._`,
                  `_Pattern lifecycle: DETECTED → DIAGNOSED → REVIEWED → TESTED → PROMOTED_`,
                ].join('\n'),
                labels: ['ci-fix-bot', 'auto-fix'],
              });

              core.info(`Created fix PR #${pr.data.number}: ${pr.data.html_url}`);
            } catch (e) {
              core.error(`Failed to create fix PR: ${e.message}`);
            }

      - name: Create issue for unfixable failures
        if: steps.fix.outputs.fixed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const workflow = process.env.FAILED_WORKFLOW;
            const runId = process.env.FAILED_RUN_ID;
            const sha = process.env.FAILED_HEAD_SHA;
            const htmlUrl = process.env.FAILED_HTML_URL;
            const branch = process.env.FAILED_BRANCH;
            const fingerprint = process.env.PATTERN_FINGERPRINT || 'unknown';
            const isNew = process.env.PATTERN_IS_NEW === 'true';
            const patternCount = process.env.PATTERN_COUNT || '1';
            const signature = process.env.PATTERN_SIGNATURE || 'unknown error';

            let errorLines = [];
            try {
              const logs = fs.readFileSync('/tmp/all-logs.txt', 'utf8');
              errorLines = logs.split('\n').filter(l =>
                l.includes('error:') || l.includes('Error:') ||
                l.includes('FAILED') || l.includes('Traceback') ||
                l.includes('Exception') || l.includes('##[error]')
              ).slice(0, 25);
            } catch (e) {}

            // Check for existing issue with same fingerprint
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'ci-fix-bot'
            });

            // Look for existing issue mentioning this fingerprint
            const dup = existing.data.find(i =>
              i.body && i.body.includes(fingerprint)
            );

            if (dup) {
              // Update existing issue with new occurrence
              const newBody = dup.body + `\n\n## New occurrence — ${new Date().toISOString()}\n\n- Workflow: ${workflow}\n- Run: ${htmlUrl}\n- Count: ${patternCount}x\n`;
              await github.rest.issues.update({
                ...context.repo,
                issue_number: dup.number,
                body: newBody,
              });

              // Add a comment
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: dup.number,
                body: `Recurring failure #${patternCount}: [${workflow}](${htmlUrl}) on \`${sha.slice(0, 12)}\`\n\nPattern: \`${fingerprint}\`\nSignature: ${signature}`,
              });

              core.info(`Updated existing issue #${dup.number} for pattern ${fingerprint}`);
              return;
            }

            const statusBadge = isNew ? '🆕 NEW PATTERN' : `RECURRING (${patternCount}x)`;

            const body = [
              `## CI Failure — ${statusBadge}`,
              ``,
              `**Pattern fingerprint:** \`${fingerprint}\``,
              `**Error signature:** ${signature}`,
              ``,
              `**Workflow:** ${workflow}`,
              `**Branch:** ${branch}`,
              `**Run:** ${process.env.FAILED_HTML_URL}`,
              `**Commit:** \`${sha}\``,
              ``,
              `### Error Excerpt`,
              ``,
              '```',
              errorLines.join('\n') || 'No error lines found',
              '```',
              ``,
              `### Pattern Lifecycle`,
              ``,
              `This failure pattern is currently at: **DETECTED**`,
              ``,
              `To promote this pattern to automatic fixing:`,
              `1. **DIAGNOSED** — Identify the root cause and write a fix (comment below)`,
              `2. **REVIEWED** — A human reviews and approves the fix approach`,
              `3. **TESTED** — Add a regression test proving the fix works`,
              `4. **PROMOTED** — The fix is added to \`ci-fix-bot/fix_engine.py\``,
              ``,
              `Once promoted, this pattern will be auto-fixed on all future occurrences.`,
              ``,
              `---`,
              `_Auto-created by **GARVIS CI Fix Bot**. It does not think. It pattern-matches._`,
              `_It does not silently learn. New patterns require human review before promotion._`,
            ].join('\n');

            await github.rest.issues.create({
              ...context.repo,
              title: `[CI Fix Bot] ${statusBadge}: ${signature.slice(0, 80)}`,
              body: body,
              labels: ['ci-failure', 'ci-fix-bot', 'needs-diagnosis']
            });

            core.info('Created issue for unfixable failure');
